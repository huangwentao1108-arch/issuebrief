name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/issuebrief-smoke"
          "${RUNNER_TEMP}/issuebrief-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/issuebrief-smoke/bin/issuebrief" --help
          printf 'token=synthetic-value-12345\n' \
            | "${RUNNER_TEMP}/issuebrief-smoke/bin/issuebrief" sanitize \
            | grep -F '[REDACTED:CREDENTIAL_VALUE]'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
