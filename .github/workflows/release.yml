name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # Publishing is only configured for the canonical repository.
    if: github.repository == 'huangwentao1108-arch/issuebrief'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python -c "import os; import issuebrief; expected = f'v{issuebrief.__version__}'; actual = os.environ['RELEASE_TAG']; assert actual == expected, f'Release tag {actual!r} does not match package version {expected!r}'"
      - name: Build distributions
        run: |
          python -m pip install "build==1.5.0" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/issuebrief-smoke"
          "${RUNNER_TEMP}/issuebrief-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/issuebrief-smoke/bin/issuebrief" --help
          printf 'token=synthetic-value-12345\n' \
            | "${RUNNER_TEMP}/issuebrief-smoke/bin/issuebrief" sanitize \
            | grep -F '[REDACTED:CREDENTIAL_VALUE]'
      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/issuebrief/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}"
