name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Scan for committed secrets
        shell: bash
        run: |
          detect-secrets scan > "${RUNNER_TEMP}/secrets.json"
          python -c "import json,sys; data=json.load(open(sys.argv[1], encoding='utf-8')); assert not data['results'], data['results']" "${RUNNER_TEMP}/secrets.json"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install .
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
