name: Feature request
description: Suggest a focused improvement to issuebrief
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or unreviewed command output.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What safe diagnostic-sharing workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or report shape where helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
