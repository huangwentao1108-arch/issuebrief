name: Bug report
description: Report a reproducible problem with issuebrief
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, access tokens, private keys, or unreviewed diagnostic output. If this is a security issue or a redaction bypass, use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: issuebrief version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12.0 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and expected behavior
      description: Use synthetic values only.
      render: console
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a minimal, sanitized reproduction.
    validations:
      required: true
